name: Security & Dependency Management

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Review backend dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: .github/dependency-review-config.yml
          fail-on-severity: high
      
      - name: Review frontend dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: .github/dependency-review-config.yml
          fail-on-severity: high

  backend-security-scan:
    name: Backend Deep Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install security tools
        run: |
          pip install bandit safety semgrep detect-secrets
      
      - name: Run Bandit (SAST)
        run: |
          bandit -r app/ -f sarif -o bandit-results.sarif
      
      - name: Run Semgrep (OWASP Top 10)
        run: |
          semgrep --config=p/owasp-top-ten --config=p/secrets app/ --sarif -o semgrep-results.sarif || true
      
      - name: Run Safety (known vulnerabilities)
        run: |
          safety check --json --output safety-results.json || true
      
      - name: Run TruffleHog (secrets detection)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --json > trufflehog-results.json
      
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit
      
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  frontend-security-scan:
    name: Frontend Deep Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: |
          npm audit --audit-level=high --json > npm-audit.json || true
      
      - name: Run ESLint security plugin
        run: |
          echo "ESLint not configured - skipping" || true
      
      - name: Run Semgrep on frontend
        run: |
          pip install semgrep && semgrep --config=p/owasp-top-ten --config=p/secrets src/ --sarif -o semgrep-frontend.sarif || true
      
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-frontend.sarif
          category: semgrep-frontend

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: [backend-security-scan, frontend-security-scan]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        run: |
          docker build -t phantomscan-backend:scan ./backend
      
      - name: Build frontend image
        run: |
          docker build -t phantomscan-frontend:scan ./frontend
      
      - name: Run Trivy scanner (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: phantomscan-backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
      
      - name: Run Trivy scanner (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: phantomscan-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
      
      - name: Upload Trivy results (frontend)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --json --no-verification